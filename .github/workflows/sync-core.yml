name: Sync CONTENTY Core Submodule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sis with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update core submodule to latest CONTENTY main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git submodule sync -- core
          git submodule update --remote --merge core
          if git diff --quiet core; then
            echo "core is already up to date."
            exit 0
          fi
          git add core
          git commit -m "chore(core): sync waldseelen/CONTENTY submodule"
          git push
